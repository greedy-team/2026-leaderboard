name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: ./be
        run: chmod +x gradlew

      - name: Check jar contents
        working-directory: ./be
        run: jar tf build/libs/*.jar | grep controller

      - name: Build with Gradle
        working-directory: ./be
        run: ./gradlew clean bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 985818273436.dkr.ecr.ap-northeast-2.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker build -t leaderboard ./be
          docker tag leaderboard:latest 985818273436.dkr.ecr.ap-northeast-2.amazonaws.com/leaderboard:latest
          docker push 985818273436.dkr.ecr.ap-northeast-2.amazonaws.com/leaderboard:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            bash deploy.sh